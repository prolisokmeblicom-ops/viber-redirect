<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Накладна</title>
<style>
  [hidden] { display: none !important; }
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
         align-items: center; justify-content: center; background: #f4f4f7; color: #222; }
  main { text-align: center; padding: 24px; max-width: 360px; }
  h1 { font-size: 22px; margin: 0 0 12px; }
  a.btn { display: block; margin: 12px 0; padding: 14px 24px; border-radius: 10px;
          background: #7360f2; color: #fff; text-decoration: none; font-size: 18px; }
  a.btn.alt { background: #e4e1fb; color: #3d2fa8; }
  .hint { color: #666; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <h1 id="title">Накладна</h1>
  <p id="msg">Готуємо файл…</p>
  <a class="btn" id="open" href="#" hidden>Відкрити накладну</a>
  <a class="btn alt" id="save" href="#" hidden>Завантажити PDF</a>
  <p class="hint" id="hint" hidden></p>
</main>
<script>
  // The PDF is stored on GitHub only encrypted; the key is in this link's #fragment
  // (never sent to any server) and the file is decrypted here, in the browser.
  var REPO = "prolisokmeblicom-ops/viber-redirect", BRANCH = "main";

  // Link format: "<file>.<key>.<orderId>"
  var raw = (location.hash || "").slice(1);
  try { if (/%[0-9A-Fa-f]{2}/.test(raw)) raw = decodeURIComponent(raw); } catch (e) {}
  var parts = raw.split(".");
  var file = parts[0] || "", key = parts[1] || "", orderId = (parts[2] || "").replace(/\D/g, "");
  var title = orderId ? "Накладна №" + orderId : "Накладна";
  document.getElementById("title").textContent = title;
  var msg = document.getElementById("msg"), hint = document.getElementById("hint");

  function b64urlToBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  (async function () {
    if (!/^[0-9a-f]{32}$/.test(file) || !key) { msg.textContent = "Некоректне посилання."; return; }
    try {
      var url = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/f/" + file + ".bin";
      var resp = await fetch(url, { cache: "no-store" });
      if (!resp.ok) throw new Error("HTTP " + resp.status);
      var buf = new Uint8Array(await resp.arrayBuffer());
      var k = await crypto.subtle.importKey("raw", b64urlToBytes(key), "AES-GCM", false, ["decrypt"]);
      var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, k, buf.slice(12));
      var href = URL.createObjectURL(new Blob([plain], { type: "application/pdf" }));
      var open = document.getElementById("open"), save = document.getElementById("save");
      open.href = href; open.hidden = false;
      save.href = href; save.download = title + ".pdf"; save.hidden = false;
      msg.textContent = "Файл готовий.";
    } catch (e) {
      msg.textContent = "Не вдалося отримати накладну. Зверніться до відправника.";
    }
  })();
</script>
</body>
</html>
