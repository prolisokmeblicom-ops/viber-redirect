<!doctype html>
<html lang="uk">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Відкрити Viber</title>
<style>
  [hidden] { display: none !important; }
  body { font-family: system-ui, sans-serif; margin: 0; min-height: 100vh; display: flex;
         align-items: center; justify-content: center; background: #f4f4f7; color: #222; }
  main { text-align: center; padding: 24px; max-width: 360px; }
  a.btn { display: block; margin: 12px 0; padding: 14px 24px; border-radius: 10px;
          background: #7360f2; color: #fff; text-decoration: none; font-size: 18px; }
  a.btn.alt { background: #e4e1fb; color: #3d2fa8; }
  .num { font-size: 20px; font-weight: 600; letter-spacing: .5px; }
  .hint { color: #666; font-size: 14px; margin-top: 16px; }
</style>
</head>
<body>
<main>
  <p id="msg">Готуємо…</p>
  <p class="num" id="num"></p>
  <a class="btn" id="share" href="#" hidden>📤 Надіслати файл у Viber</a>
  <a class="btn alt" id="dl" href="#" hidden>Завантажити накладну</a>
  <a class="btn alt" id="open" href="#" hidden>Відкрити чат у Viber</a>
  <p class="hint" id="hint" hidden></p>
</main>
<script>
  // Everything after the '#' (phone, file name, key) stays in the browser — it
  // is never sent to any server. The PDF itself sits on GitHub only in
  // encrypted form; the key in this fragment is what unlocks it, here.
  var REPO = "prolisokmeblicom-ops/viber-redirect", BRANCH = "main";

  /*PARSE_START*/
  // Link formats: "<phone>.<file>.<key>.<orderId>" (dots only — survives any
  // in-app browser re-encoding), the older "n=..&f=..&k=..&t=..", or just "<phone>".
  function parseHash(raw) {
    try { if (/%[0-9A-Fa-f]{2}/.test(raw)) raw = decodeURIComponent(raw); } catch (e) {}
    var digits = "", file = "", key = "", title = "Накладна";
    if (raw.indexOf("=") >= 0) {
      var p = new URLSearchParams(raw);
      digits = p.get("n") || ""; file = p.get("f") || ""; key = p.get("k") || ""; title = p.get("t") || title;
    } else {
      var parts = raw.split(".");
      digits = parts[0] || ""; file = parts[1] || ""; key = parts[2] || "";
      if (parts[3]) title = "Накладна-" + parts[3].replace(/\D/g, "");
    }
    return { digits: digits.replace(/\D/g, ""), file: file, key: key, title: title };
  }
  /*PARSE_END*/

  var rawHash = (location.hash || "").slice(1);
  var info = parseHash(rawHash);
  var msg = document.getElementById("msg"), hint = document.getElementById("hint");
  var shareBtn = document.getElementById("share"), dlBtn = document.getElementById("dl"),
      openBtn = document.getElementById("open");

  function b64urlToBytes(s) {
    s = s.replace(/-/g, "+").replace(/_/g, "/");
    while (s.length % 4) s += "=";
    var bin = atob(s), out = new Uint8Array(bin.length);
    for (var i = 0; i < bin.length; i++) out[i] = bin.charCodeAt(i);
    return out;
  }

  async function fetchPdf() {
    var url = "https://raw.githubusercontent.com/" + REPO + "/" + BRANCH + "/f/" + info.file + ".bin";
    var resp = await fetch(url, { cache: "no-store" });
    if (!resp.ok) throw new Error("HTTP " + resp.status);
    var buf = new Uint8Array(await resp.arrayBuffer());
    var key = await crypto.subtle.importKey("raw", b64urlToBytes(info.key), "AES-GCM", false, ["decrypt"]);
    var plain = await crypto.subtle.decrypt({ name: "AES-GCM", iv: buf.slice(0, 12) }, key, buf.slice(12));
    return new Blob([plain], { type: "application/pdf" });
  }

  function saveBlob(blob) {
    var a = document.createElement("a");
    a.href = URL.createObjectURL(blob);
    a.download = info.title + ".pdf";
    document.body.appendChild(a);
    a.click();
    a.remove();
  }

  (async function () {
    if (info.digits.length < 9 || info.digits.length > 15) {
      msg.textContent = "Некоректне посилання.";
      hint.textContent = "(отримано " + rawHash.length + " символів)";
      hint.hidden = false;
      return;
    }
    var link = "viber://chat?number=%2B" + info.digits;
    document.getElementById("num").textContent = "+" + info.digits;
    openBtn.href = link; openBtn.hidden = false;

    if (!info.file || !info.key) {
      msg.textContent = "Відкриваємо Viber…";
      setTimeout(function () { location.href = link; }, 300);
      return;
    }

    var blob;
    try {
      msg.textContent = "Готуємо накладну…";
      blob = await fetchPdf();
    } catch (e) {
      msg.textContent = "Не вдалося отримати накладну — перешліть її з Telegram вручну.";
      setTimeout(function () { location.href = link; }, 1500);
      return;
    }

    var file = new File([blob], info.title + ".pdf", { type: "application/pdf" });
    var canShare = !!(navigator.canShare && navigator.share && navigator.canShare({ files: [file] }));
    dlBtn.onclick = function (e) { e.preventDefault(); saveBlob(blob); };
    dlBtn.hidden = false;

    if (canShare) {
      // Phones: the share sheet sends the file itself straight to Viber (then
      // pick the client) — needs a tap, so no auto-redirect here.
      msg.textContent = "Накладна готова.";
      shareBtn.hidden = false;
      shareBtn.onclick = async function (e) {
        e.preventDefault();
        try { await navigator.share({ files: [file], title: info.title }); }
        catch (err) { if (err && err.name !== "AbortError") { saveBlob(blob); } }
      };
      hint.textContent = "Натисніть «Надіслати файл у Viber» → оберіть Viber → клієнта. " +
        "Якщо нічого не відбувається — відкрийте цю сторінку в Safari/Chrome (меню ··· → «Відкрити в браузері»).";
      hint.hidden = false;
    } else {
      // Desktop / browsers without file sharing: save it, then open the chat.
      saveBlob(blob);
      msg.textContent = "Накладну збережено. Відкриваємо Viber…";
      hint.textContent = "У чаті натисніть 📎 → Файли → оберіть щойно завантажену накладну.";
      hint.hidden = false;
      setTimeout(function () { location.href = link; }, 1500);
    }
  })();
</script>
</body>
</html>
